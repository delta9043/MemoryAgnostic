dataset:
  name: locomo10
  path: /data/delta9043/datasets/locomo/locomo10.json

pipeline:
  pre_chunking:
    - type: NoFilter
    - type: NoCompressor
  chunker:
    type: PrecomputedChunker
    chunks_path: data/chunked_data/chunks_fable-5.json

memory_backend:
  type: AMemBackend
  base_url: http://localhost:8000/v1
  model: /data/delta9043/models/Qwen3-14B
  # 청킹 비교 arm 공통 k=5 (k=10은 컨텍스트 초과; 재현 arm만 논문값 10)
  retrieve_k: 5

evaluation:
  results_dir: results/amem/llmchunker