dataset:
  name: locomo10
  path: /data/delta9043/datasets/locomo/locomo10.json

pipeline:
  pre_chunking:
    - type: NoFilter
    - type: NoCompressor
  chunker:
    type: NoChunker

memory_backend:
  type: AMemBackend
  base_url: http://localhost:8000/v1
  model: /data/delta9043/models/Qwen3-14B
  # 청킹 비교 arm 공통 k=5 (k=10은 컨텍스트 초과; 재현 arm만 논문값 10)
  retrieve_k: 5   # dictionary 형태 가능
    # default: 10
    # open_domain: 50

evaluation:
  result_file: results/amem/default/result.json
