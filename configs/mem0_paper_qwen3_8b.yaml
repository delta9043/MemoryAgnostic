dataset:
  name: locomo10
  path: /data/delta9043/datasets/locomo/locomo10.json

pipeline:
  pre_chunking:
    - type: NoFilter
    - type: NoCompressor
  chunker:
    type: FixedSizeChunker
    window: 2
    overlap: 0

memory_backend:
  type: Mem0Backend
  base_url: http://localhost:8000/v1
  model: /data/delta9043/models/Qwen3-8B
  embedding_path: /data/delta9043/models/all-MiniLM-L6-v2
  embedding_dims: 384
  qdrant_path: ./qdrant_data/mem0_paper_qwen3_8b
  top_k: 30

evaluation:
  results_dir: results/mem0/paper_qwen3_8b