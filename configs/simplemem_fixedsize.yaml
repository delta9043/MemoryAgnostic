dataset:
  name: locomo10
  path: /data/delta9043/datasets/locomo/locomo10.json

pipeline:
  pre_chunking:
    - type: NoFilter
    - type: NoCompressor
  chunker:
    # SimpleMem native 윈도잉(20턴/5겹침)을 청커 층에서 재현한 참고 조건.
    # backend는 내부 윈도잉을 쓰지 않으므로 다른 조건과 코드 경로가 같다.
    type: FixedSizeChunker
    window: 20
    overlap: 5

memory_backend:
  type: SimpleMemBackend
  base_url: http://localhost:8000/v1
  model: /data/delta9043/models/Qwen3-14B
  db_path: ./lancedb_data/fixedsize
  clear_db_on_init: true
  # 검색 파라미터. 아래 값은 SimpleMem config.py 기본값(native)과 동일 —
  # 조정하려면 여기서 바꾼다. reflection은 불충분 판정 시 쿼리 1~3개 ×
  # semantic_top_k를 라운드마다 누적하므로 답변 컨텍스트 크기를 좌우한다.
  semantic_top_k: 25
  keyword_top_k: 5
  structured_top_k: 5
  enable_reflection: true
  max_reflection_rounds: 2

evaluation:
  results_dir: results/simplemem/fixedsize