dataset:
  name: locomo10
  path: /data/delta9043/datasets/locomo/locomo10.json

pipeline:
  pre_chunking:
    - type: NoFilter
    - type: NoCompressor
  chunker:
    # 어텐션 골짜기 청커(우리 방법). 인라인 실행 — 첫 push()에서 LLMLingua-2를
    # in-process 로드(샘플마다 재로드). turn마다 forward 1회, 결정 지연 1턴.
    type: AttnChunker
    model_path: /data/delta9043/models/llmlingua-2
    tau: 0.00234   # v2 gold 스윕 최적. 더 잘게 자르려면 올린다(0.0024 ≈ 평균 12.2턴)

memory_backend:
  type: AMemBackend
  base_url: http://localhost:8000/v1
  model: /data/delta9043/models/Qwen3-14B
  # 청킹 비교 arm 공통 k=5 (k=10은 컨텍스트 초과; 재현 arm만 논문값 10)
  retrieve_k: 5

evaluation:
  results_dir: results/amem/attnchunk